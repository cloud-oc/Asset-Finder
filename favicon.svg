<?xml version="1.0" encoding="UTF-8"?>
<!-- Geometric batch resource search icon: stacked files, scan marks, magnifier -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Batch resource search">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b1522"/>

  <!-- stacked project files -->
  <rect x="11" y="12" width="28" height="36" rx="4" fill="#0b6d91" stroke="#072b3d" stroke-width="1.5"/>
  <rect x="16" y="9" width="29" height="37" rx="4" fill="#0f93ba" stroke="#072b3d" stroke-width="1.5"/>
  <path d="M34 9h7l4 4v9h-11z" fill="#42c6df" stroke="#072b3d" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M21 27h17M21 33h13M21 39h9" stroke="#d8f8ff" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>

  <!-- batch scan marks -->
  <path d="M9 19v-4a3 3 0 0 1 3-3h4M9 39v4a3 3 0 0 0 3 3h4M38 12h4a3 3 0 0 1 3 3v4" fill="none" stroke="#8be7ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="26" cy="20" r="2" fill="#8be7ff"/>
  <circle cx="32" cy="20" r="2" fill="#8be7ff"/>

  <!-- search lens -->
  <circle cx="45" cy="43" r="10" fill="#0b1522" stroke="#ffffff" stroke-width="3.5"/>
  <circle cx="45" cy="43" r="4" fill="#19b8e8" opacity=".9"/>
  <path d="M52.5 50.5 59 57" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
